# Actions are pinned to full-length commit SHAs - a version tag is a moving
# target that the action's owner can repoint at any commit, and a workflow that
# can write to this repository is a bad place for that. The comment beside each
# SHA is the release it was taken from; to update one, resolve the tag again
# rather than replacing the SHA with the tag.
#
#   git ls-remote --tags https://github.com/actions/checkout | grep 'v7.0.1$'
#
# An annotated tag needs the dereferenced line - refs/tags/x^{} - which is the
# commit; the bare line is the tag object and will not be accepted.

name: ci

on:
  push:
    branches: [master]
    tags: ['*']
  pull_request:
  workflow_dispatch:

# One run per branch or PR. A push that lands while an earlier one is still
# going makes the earlier one irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; the release job widens this for itself alone.
permissions:
  contents: read

jobs:
  tests:
    name: tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 8.3 is the floor composer.json declares and what production runs. Add a
        # version here when something deploys on one, rather than testing a
        # platform nobody has.
        php: ['8.3']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          # intl is not a declared requirement and nothing in the dependency
          # tree asks for it - it is here because the PHP install this tool runs
          # on has it, since provisioning installs it, and CI testing a leaner
          # interpreter than production proves the wrong thing.
          extensions: intl
          coverage: none

      - run: composer install --no-interaction --prefer-dist --no-progress

      - run: php vendor/bin/pest

  build:
    name: compiled binary
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # app:build takes its version from `git describe`, so the tags have to
          # be here or the artefact announces itself as "unreleased"
          fetch-depth: 0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: intl
          coverage: none
          # box writes a phar, which php refuses to do by default
          ini-values: phar.readonly=0

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Compile
        # composer build installs --no-dev, compiles, restores, and then fails
        # if laravel/pint is still findable in the artefact. app:build never
        # runs composer and box.json takes vendor/ wholesale, so building from a
        # dev checkout compiles pint, phpunit, pest and mockery in - 23 MB of a
        # 29 MB binary, and nothing noticed for five releases.
        run: composer build

      - name: It runs, and reports itself
        # Everything here is about the ARTEFACT rather than the source, so it is
        # what the suite cannot cover: app:build evaluates config/app.php on the
        # build machine and compiles the result in as a literal, and box's
        # compactors rewrite what ships. A version of "unreleased" here means
        # the checkout above lost its tags.
        run: |
          ./builds/wback --version
          ./builds/wback list > /dev/null
          ./builds/wback app:config --only=application

      - name: A mistyped command still exits non-zero
        # UnknownCommandTest covers this in the source. It is repeated on the
        # compiled binary because that is where it could differ - the App\Kernel
        # override only works if bootstrap/app.php's rebinding survives the
        # build - and because this tool's exit code is the whole of what cron
        # reads.
        run: |
          if ./builds/wback app:validte > /dev/null 2>&1; then
            echo 'A mistyped command exited 0'
            exit 1
          fi

  release:
    name: publish the release
    runs-on: ubuntu-latest

    # Only a tag publishes, and only after everything else has passed. A binary
    # other machines download and trust with their backups is not the place to
    # find out the suite was red.
    needs: [tests, build]
    if: startsWith(github.ref, 'refs/tags/')

    # The only job that may write to the repository, and it says so here rather
    # than at the top of the file.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # see the build job - without the history the release announces itself
          # as "unreleased"
          fetch-depth: 0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: intl
          coverage: none
          ini-values: phar.readonly=0

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Compile
        # Compiled here rather than carried over from the build job. Passing the
        # artefact between jobs would publish the exact binary that was smoke
        # tested, which is the better property - but it costs two more actions
        # to pin and keep current, and the same commit compiles to the same
        # thing. The checks below repeat that job's, on what actually ships.
        run: composer build

      - name: It announces the tag it was built from
        # The trap this exists for: config/app.php holds `app('git.version')`,
        # and app:build compiles the result in as a literal. Building before
        # tagging ships a binary announcing the PREVIOUS release, with nothing
        # downstream to contradict it. A tag-triggered build cannot get the
        # order wrong, and this asserts it anyway.
        run: |
          ./builds/wback list > /dev/null

          built=$(./builds/wback --version | awk '{print $NF}')

          if [ "$built" != "$GITHUB_REF_NAME" ]; then
            echo "The binary says [$built] but the tag is [$GITHUB_REF_NAME]."
            exit 1
          fi

          echo "$built"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # These two asset names are load-bearing and must not be tidied. The
          # README's install block fetches wback-<version> and runs
          # `sha256sum --ignore-missing -c SHA256SUMS`, which only matches
          # because the name INSIDE the sums file is the downloaded filename;
          # Provisioning builds the same URL and pins the hash.
          # Every release back to 7.0.0 uses these names.
          cd builds
          mv wback "wback-$GITHUB_REF_NAME"
          sha256sum "wback-$GITHUB_REF_NAME" > SHA256SUMS
          cat SHA256SUMS
          cd ..

          # The hand-written entry for this version, which is worth more than
          # anything generated from the commits. Stops at the next heading, or
          # at a link-reference footer if the changelog ever grows one.
          awk -v tag="$GITHUB_REF_NAME" '
            $0 ~ "^## \\[" tag "\\]" { found = 1; next }
            found && /^## / { exit }
            found && /^\[.*\]: http/ { exit }
            found { print }
          ' CHANGELOG.md > body.md

          {
            echo "Needs PHP 8.3 or newer. Download both assets, keep the binary"
            echo "named \`wback-$GITHUB_REF_NAME\` so the checksum matches, and verify with"
            echo "\`sha256sum --ignore-missing -c SHA256SUMS\` before installing it."
            echo "See the README for the .env it then needs."
            echo
          } | cat - body.md > notes.md

          # Falls back to generated notes rather than failing the release if the
          # changelog section is missing.
          if [ ! -s body.md ]; then
            gh release create "$GITHUB_REF_NAME" \
              "builds/wback-$GITHUB_REF_NAME" builds/SHA256SUMS \
              --title "$GITHUB_REF_NAME" --verify-tag --generate-notes
          else
            gh release create "$GITHUB_REF_NAME" \
              "builds/wback-$GITHUB_REF_NAME" builds/SHA256SUMS \
              --title "$GITHUB_REF_NAME" --verify-tag --notes-file notes.md
          fi
